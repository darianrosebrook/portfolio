# Marks this directory as its own pnpm workspace root, so pnpm doesn't
# walk up the directory tree and find a parent workspace (e.g., one in
# the user's home directory) and treat THIS project as a workspace
# member of that. Without this file, `pnpm install` would read the
# parent workspace's package.json and ignore this project's overrides.
packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  es5-ext: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 2.1.2 || 2.1.3 || 2.1.4 || 5.0.6 || 5.0.7 || 5.0.8 || 5.0.9
  - vite@7.3.5
  - markdown-it@14.1.2
  - linkify-it@5.0.1 || 5.0.2
  - js-yaml@4.1.2 || 4.3.0
  - ws@7.5.11 || 8.21.0
  - '@babel/core@7.29.1'
  - immutable@5.1.8
  - fast-uri@3.1.3 || 3.1.4 || 3.1.5
  - sharp@0.35.0
  - next@16.2.11
  - postcss@8.5.18 || 8.5.23

# pnpm v11+ reads overrides from this file, not package.json#pnpm.
# Keep floor overrides at the patched advisory minima — do not pin below them.
overrides:
  '@babel/core@<=7.29.0': ^7.29.1
  '@isaacs/brace-expansion': ^5.0.1
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=3.0.0 <5.0.9: ^5.0.9
  fast-uri: ^3.1.5
  flatted: ^3.4.2
  # Direct + transitive (test-exclude via @vitest/coverage-v8) — v10/v11 are deprecated.
  glob: ^13.0.6
  happy-dom: ^20.8.9
  immutable: ^5.1.8
  js-yaml: ^4.3.0
  linkify-it: ^5.0.2
  markdown-it: ^14.1.2
  next: ^16.2.11
  picomatch: ^4.0.4
  postcss: ^8.5.23
  rollup: ^4.59.0
  sharp: ^0.35.0
  vite: ^7.3.5
  'ws@^7.0.0': ^7.5.11
  'ws@^8.0.0': ^8.21.0
  yaml: ^2.8.3
