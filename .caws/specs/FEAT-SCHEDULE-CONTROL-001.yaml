blast_radius:
  modules:
    - 'dashboard content editor — schedule control'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'app/dashboard/_components/ContentEditor.tsx'
    - 'app/dashboard/_components/ContentEditor.module.css'
  out: []
invariants:
  - 'Scheduling from the editor publishes nothing: the item waits for the executor'
  - 'Returning an item to draft clears its schedule'
  - 'The control never sends a schedule without a moment'
acceptance:
  - id: A1
    given: 'an item open in the editor'
    when: 'the author sets a future moment and activates Schedule'
    then: 'the item stores status scheduled with that moment and appears in the overview Scheduled queue'
  - id: A2
    given: 'a scheduled item'
    when: 'the author returns it to draft'
    then: 'its schedule is cleared as well as its status'
  - id: A3
    given: 'no moment set'
    when: 'the editor renders'
    then: 'the Schedule action is disabled rather than sending an empty schedule'
non_functional: {}
contracts:
  - name: 'publish-scheduling'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Browser run against the live database with a throwaway draft article open in the editor: typing a future moment into the Schedule for field and activating Schedule stored status \"scheduled\" with scheduled_at \"2026-09-24T06:41:00+00:00\" and published_at still null, so nothing was published; the editor swapped its action to Unschedule; and a server-rendered fetch of /dashboard contained both the scheduled-queue region and the probe headline, so the item appears in the overview queue. Probe deleted afterwards (204) and the overview no longer listed it. No committed test covers the editor: ContentEditor is a large client component needing fetch, localStorage and Tiptap mocks, so the runtime observation is the evidence."
    recorded_at: "2026-09-21T06:42:36.059Z"
    command: "browser: POST /api/articles, open the editor, set #scheduled_at, click Schedule, read back via the API and the /dashboard HTML"
