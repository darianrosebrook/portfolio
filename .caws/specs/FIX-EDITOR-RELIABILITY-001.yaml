id: FIX-EDITOR-RELIABILITY-001
title: 'Make existing content editing recoverable and serialize publishing transitions'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: editor-reliability
created_at: '2026-09-08T04:55:56.624Z'
updated_at: '2026-09-08T05:11:24.002Z'
created_by_session: '01a07f29-765d-7471-b649-d3b07bd7d5ee'
blast_radius:
  modules:
    - 'Existing article and case-study editing'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'app/dashboard/_components/'
    - 'utils/editor/'
    - 'test/dashboard/'
    - 'app/api/articles/'
    - 'app/api/case-studies/'
    - 'app/api/search-content/'
    - 'utils/schemas/contentRelations.schema.ts'
    - 'utils/supabase/contentRelations.ts'
    - 'test/utils/contentRelations.test.ts'
    - 'ui/modules/Tiptap/'
    - 'utils/tiptap/'
    - 'test/utils/tiptap/'
    - 'app/_components/'
    - context/UserContext.tsx
    - app/auth/
    - app/ha/actions.ts
    - test/context/
    - test/auth/
    - app/dashboard/
    - utils/schemas/case-study.schema.ts
    - test/utils/schemas/
    - test/api/
    - test/app/auth/
  out: []
invariants:
  - 'Unsaved content remains recoverable and discard or publish cannot be overtaken by earlier autosaves.'
acceptance:
  - id: A1
    given: 'pending or in-flight saves'
    when: 'editing, navigation, discard, or publish occurs'
    then: 'revisions remain recoverable and transitions are serialized without stale writes.'
  - id: A2
    given: 'a local publication date'
    when: 'the editor displays and saves it'
    then: 'the intended instant is preserved across time zones.'
  - id: A3
    given: 'A creator uses the dashboard'
    when: 'Finding or creating content'
    then: 'Lists use draft metadata, query errors are explicit, and articles and case studies can be created.'
  - id: A4
    given: 'A login or session refresh'
    when: 'Authentication completes or fails'
    then: >-
      Profile loading cannot deadlock or apply stale data, and login failures
      preserve a safe retry destination.
non_functional: {}
contracts:
  - name: 'editor-persistence'
    type: behavior
