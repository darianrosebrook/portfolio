id: FIX-DASH-AUTH-001
title: 'Reliable dashboard authentication and recoverable login failures'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-08T04:56:52.337Z'
updated_at: '2026-09-08T05:35:57.130Z'
created_by_session: '01a07f5e-6bef-7423-99dc-c128c180d9a8'
blast_radius:
  modules:
    - 'dashboard-authentication'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'context/UserContext.tsx'
    - 'app/auth/'
    - 'app/ha/actions.ts'
    - 'test/context/UserContext.test.tsx'
    - 'test/app/auth/'
  out: []
invariants:
  - 'Authentication callbacks return synchronously and obsolete profile requests cannot alter current session state.'
acceptance:
  - id: A1
    given: 'A mounted user provider and concurrent authentication events'
    when: 'Tokens refresh, accounts change, requests fail or resolve out of order'
    then: 'Profile reads run outside the auth callback and only current session requests update visible state'
  - id: A2
    given: 'OAuth or email confirmation cannot complete'
    when: 'A provider error, missing token or network failure occurs'
    then: 'The user reaches an actionable login error page with a safe preserved retry destination'
non_functional: {}
contracts:
  - name: 'auth-session'
    type: behavior
    path: 'context/UserContext.tsx'
