id: FIX-009
title: 'Restore private registry auth references so a clean pnpm install succeeds'
risk_tier: 3
mode: fix
lifecycle_state: active
worktree: fix-009-registry-auth
created_at: '2026-08-06T13:51:34.220Z'
updated_at: '2026-08-06T13:51:34.220Z'
blast_radius:
  modules:
    - build-config
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.npmrc'
    - '.env.example'
  out: []
invariants:
  - No literal credential is ever written to a tracked file; only ${ENV_VAR} references
  - A clean install needs no per-machine ~/.npmrc edit when the documented env vars are set
acceptance:
  - id: A1
    given: commit 48ffdbd7 removed the ${FONTAWESOME_PACKAGE_TOKEN} and ${TIPTAP_PRO_PACKAGE_TOKEN} auth references from .npmrc, so pnpm install fails ERR_PNPM_FETCH_401
    when: the two env-var reference lines are restored to the committed .npmrc
    then: pnpm install completes without a 401 and without NPM_CONFIG_USERCONFIG layering
  - id: A2
    given: the removal was motivated by keeping registry auth out of the committed .npmrc
    when: the restored file is inspected
    then: it contains only ${VAR} indirections and no literal token, so the stated hygiene goal still holds
  - id: A3
    given: the required tokens were undiscoverable, appearing in no .env.example entry or doc
    when: a new contributor reads .env.example
    then: both FONTAWESOME_PACKAGE_TOKEN and TIPTAP_PRO_PACKAGE_TOKEN are listed with their registry URLs
non_functional: {}
contracts: []
