invariants:
  - 'The public site keeps its section minimum height; only the dashboard is exempt'
  - 'Dashboard sections size to their content'
acceptance:
  - id: A1
    given: 'the overview at a tall viewport'
    when: 'the library cards and the three regions render'
    then: 'their height is driven by their content rather than by 20vh'
  - id: A2
    given: 'a public page'
    when: 'its sections render'
    then: 'the global section minimum still applies'
  - id: A3
    given: 'the dashboard after the change'
    when: 'it is measured'
    then: 'no horizontal overflow appears and no content is lost'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "At a 768x1400 viewport the library card reports min-height \"auto\" and renders 120px, which equals its content (h2 18 + counts 42 + link 18 = 78) plus the two 8px row gaps (16) plus 12px padding on both sides (24) plus the 1px borders (2) — measured as contentPlusGapsPadding 120 against a rendered 120. Before the change the same card reported min-height 280px, exactly 20vh of that viewport, and tracked the viewport rather than the content: it was 180px at a 900px-high viewport and 280px at 1400px, with 78px of content throughout. Every section inside the dashboard main column now reports min-height auto (Library status, both cards, needs-attention, scheduled-queue if present, recent-activity)."
    recorded_at: "2026-09-21T07:27:43.884Z"
    command: "browser: measure the card and every main section at a 1400px-high viewport, before and after"
    commit_sha: "77be354b94abba157c477cfa933176f388c528e3"
  - criterion_id: A2
    status: pass
    evidence_ref: "The public home page on the unchanged build reports the floor intact: its \"home\" section and \"animatedSection\" both compute min-height 280px, which is 20vh of the 1400px viewport. Two further observations bound the exemption: the dashboards own outer container section, which sits outside the main column, still reports 280px, and globals.scss is unmodified by this slice (the change is one rule in app/dashboard/_components/DashboardShell.module.css)."
    recorded_at: "2026-09-21T07:27:44.520Z"
    command: "browser: measure sections on the public home page; git diff --stat for the slice"
    commit_sha: "77be354b94abba157c477cfa933176f388c528e3"