id: FEAT-221
title: 'Extract useScrollReveal hook and remove per-component FOUC opacity guards'
risk_tier: 3
mode: refactor
lifecycle_state: active
worktree: feat-221-scroll-reveal
created_at: '2026-08-04T22:30:11.936Z'
updated_at: '2026-08-04T22:30:11.936Z'
blast_radius:
  modules:
    - 'animation utilities (new useScrollReveal hook)'
    - 'public page client components (home, work, articles list, article detail)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'utils/animation/useScrollReveal.ts'
    - 'app/HomeClient.tsx'
    - 'app/work/WorkPageClient.tsx'
    - 'app/articles/ArticlesListClient.tsx'
    - 'app/articles/[slug]/ArticleDetailClient.tsx'
    - 'test/utils/animation/useScrollReveal.test.tsx'
  out: []
invariants:
  - 'Content in scroll-revealed sections is visible in its resting state without JavaScript; the reveal is an enhancement, never a precondition for visibility.'
  - 'Reduced-motion preference is respected: when set, content appears immediately with no transform or blur animation.'
  - 'The hook registers the GSAP ScrollTrigger plugin at most once and reverts its GSAP context on unmount.'
acceptance:
  - id: A1
    given: 'A page with scroll-revealed content rendered with JavaScript disabled'
    when: 'The server markup is inspected'
    then: 'No revealed element is left at opacity 0 — content is visible in its resting state'
  - id: A2
    given: 'A user with prefers-reduced-motion set'
    when: 'A page using useScrollReveal loads'
    then: 'Content appears immediately with no blur or translate animation'
  - id: A3
    given: 'All four migrated client components (Home, Work, ArticlesList, ArticleDetail)'
    when: 'They mount and later unmount'
    then: 'Reveal behavior matches the prior per-component implementation and every GSAP context is reverted'
  - id: A4
    given: 'The useScrollReveal module'
    when: 'It is imported more than once'
    then: 'gsap.registerPlugin(ScrollTrigger) has been invoked exactly once'
non_functional: {}
contracts: []
