invariants:
  - 'No package-lock.json or yarn.lock is introduced; pnpm-lock.yaml remains the single lockfile authority'
  - 'Every dependency version in package.json is an exact published release resolvable from the configured registries, with no git: or file: substitution'
  - 'The design-token artifacts are produced by the build generator rather than hand-edited, so a fresh build reproduces the committed output'
acceptance:
  - id: A1
    given: >-
      the project pins packageManager pnpm@11.20.0 and ships pnpm-lock.yaml as its
      only lockfile, and TypeScript 7 removed the classic compiler API that
      typescript-eslint requires (its peer range is >=4.8.4 <6.1.0)
    when: 'pnpm outdated is run after the upgrade'
    then: >-
      every direct dependency resolves to its latest published version except
      typescript, which is the newest release typescript-eslint supports (6.0.3)
      while the TS 7 native compiler is provided by the typescript-7 alias declared
      as npm:typescript@7.0.2, and no package-lock.json, yarn.lock or
      npm-shrinkwrap.json exists in the tree
  - id: A2
    given: >-
      the pre-upgrade baseline at 003a41ce was typecheck exit 0, eslint exit 0,
      stylelint 137 errors / 446 warnings, and vitest 1 unhandled error from GSAP
      ScrollTrigger calling requestAnimationFrame after teardown
    when: 'npm run typecheck, npm run lint and npm run lint:css execute against the upgraded toolchain'
    then: >-
      typecheck and eslint still exit 0, and stylelint loads its upgraded config
      with no unrecognised-rule or schema error and reports no more errors than the
      baseline 137
  - id: A3
    given: >-
      the build script regenerates design tokens before next build, and
      tokens:build:full deterministically omits the component.* group that
      ui/designTokens/core.tokens.json still defines (a pre-existing
      generator/source inconsistency outside this spec's scope)
    when: 'npm test and npm run build execute against the upgraded toolchain'
    then: >-
      both exit 0 and this change leaves the committed design-token artifacts
      types/designTokens.ts and ui/designTokens/designTokens.json unmodified
non_functional: {}
contracts:
