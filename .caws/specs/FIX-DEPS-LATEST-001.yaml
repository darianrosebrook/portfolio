  - 'The design-token artifacts are produced by the build generator rather than hand-edited, so a fresh build reproduces the committed output'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the project pins packageManager pnpm@11.20.0 and ships pnpm-lock.yaml; when pnpm update --latest and a clean pnpm install complete; then every direct dependency in package.json resolves to its latest published version and no package-lock.json or yarn.lock is introduced'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given TypeScript 7, ESLint 10, Stylelint 17 and Vitest 5 all change configuration surfaces; when npm run typecheck, npm run lint and npm run lint:css execute; then each exits 0 with no unrecognised-rule or config-schema error'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the build regenerates design tokens before next build; when npm test and npm run build execute; then both exit 0 and the tracked token artifacts types/designTokens.ts and ui/designTokens/designTokens.json are byte-identical to the committed revision'
