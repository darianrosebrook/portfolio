id: FEAT-220
title: 'Cache public Supabase reads with ISR and a cookieless read client'
risk_tier: 2
mode: feature
lifecycle_state: active
created_at: '2026-08-04T22:30:11.543Z'
updated_at: '2026-08-05T21:06:02.847Z'
blast_radius:
  modules:
    - 'public read path (cookieless Supabase read client)'
    - 'public content routes (articles list, article detail, case-study detail)'
    - 'cache revalidation on author writes'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'utils/supabase/readClient.ts'
    - 'app/articles/page.tsx'
    - 'app/articles/[slug]/page.tsx'
    - 'app/work/[slug]/page.tsx'
    - 'test/utils/readClient.test.ts'
    - app/api/articles/route.ts
    - app/api/articles/[slug]/route.ts
    - app/api/case-studies/route.ts
    - app/api/case-studies/[slug]/route.ts
    - utils/supabase/revalidateContent.ts
    - test/api/contentRevalidation.test.ts
    - test/pages/publicReadPaths.test.ts
  out:
    - app/api/publish/route.ts
    - test/api/publish.test.ts
invariants:
  - 'Caching never widens data exposure: the cookieless read client can only reach published rows and public columns, so a cache hit reveals nothing an uncached anonymous request would not.'
  - 'No authenticated, cookie-bearing Supabase session is opened while rendering a cacheable public page.'
  - 'The retired /api/publish endpoint keeps returning 410 Gone and performs no database write.'
  - 'A successful author write revalidates the affected public routes, so cached content is never stale past the write.'
acceptance:
  - id: A1
    given: 'A public article or case-study page request from an anonymous visitor'
    when: 'The page is rendered'
    then: 'It is served from the ISR cache without opening an authenticated cookie-bearing Supabase session'
  - id: A2
    given: 'The cookieless read client'
    when: 'It queries any public table'
    then: 'It selects only published rows and only public columns, preserving the restrictions added in 36eb7c0a and e21a8077'
  - id: A3
    given: 'An author publishes or updates an article via /api/articles or /api/case-studies'
    when: 'The write succeeds'
    then: 'The affected public routes are revalidated so the next request serves fresh content'
  - id: A4
    given: 'The retired /api/publish endpoint'
    when: 'Any request hits it after this change'
    then: 'It still returns 410 Gone and performs no database write'
non_functional: {}
contracts:
  - name: 'public-read-cache'
    type: behavior
