acceptance:
  - id: A1
    given: 'the migration file'
    when: 'it is inspected'
    then: 'it adds a nullable scheduled_at timestamptz to articles and case_studies with ADD COLUMN IF NOT EXISTS, creates one partial index per table over non-null scheduled_at, and documents rollback statements in comments'
  - id: A2
    given: 'the application as it stands'
    when: 'the dashboard renders with the migration unapplied'
    then: 'no code path references scheduled_at and the full test suite still passes'
non_functional: {}
contracts:
  - name: 'publish-scheduling'
    type: schema
