  modules:
    - utils/typeAnatomy
    - utils/geometry
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'utils/typeAnatomy/detectorRegistry.ts'
    - 'test/typeAnatomy/'
    - 'utils/geometry/geometryCore.ts'
  out: []
invariants:
  - Reconciliation suppresses only same-kind regions from different feature ids; complementary kinds (stroke vs enclosed) always coexist
  - Every assertion in test/typeAnatomy/ can fail for the behavior its comment names
  - Detection output for a glyph with no competing regions is unchanged by reconciliation
acceptance:
  - id: A1
    given: reconcile-features.test.ts asserts a glyph with a hole keeps both the surrounding stroke and the enclosed counter
    when: the assertion is tightened from `ids.has('bowl') || ids.has('counter')` to require both
    then: the test fails if either region is suppressed, and the current behavior of reconcileFeatures on 'o' is recorded as pass or fail
  - id: A2
    given: reconcileFeatures wrongly suppresses a complementary region, if A1 shows it does
    when: the suppression rule is corrected to compare region kind before dropping an instance
    then: A1's tightened assertion passes and the three existing reconciliation tests still pass unchanged
  - id: A3
    given: filterDetectedFeatures and getBestInstances are exported but uncovered (detectorRegistry.ts lines 159-170 and 176-191)
    when: tests are added pinning their selection semantics on real font fixtures
    then: both functions are exercised and detectorRegistry.ts function coverage exceeds its 63.63% baseline
non_functional: {}
contracts:
  - name: 'feature-reconciliation'
    type: behavior
