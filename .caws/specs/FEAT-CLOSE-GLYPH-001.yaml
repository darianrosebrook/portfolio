    evidence_ref: "With the panel open the close control was activated: the properties panel was present before and absent after (panelActuallyClosed true), and the toolbar toggle label changed from \"Hide properties\" to \"Properties\" — so the panel closed and the toggle reflects it. The two .closeProperties rules were removed with the button and the CSS-usage checker reports 0 unreferenced classes across 19 modules, exit 0; the full suite passed at 2072 with 13 expected failures and 2 skips."
