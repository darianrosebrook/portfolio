    evidence_ref: "Runtime on the article editor: the control is a button with class IconButton_button__H8AQr, aria-label and title both \"Close properties\", data-variant \"default\", and no style attribute, containing the icon svg. The label prop supplies the accessible name and the tooltip together, so they cannot drift apart. grep reports 0 raw button elements left in ContentEditor."
    recorded_at: "2026-09-21T07:41:54.285Z"
    command: "browser: inspect the close control on the worktree editor"
    commit_sha: "8235b6664703ad945985e962098e7f63da846b3e"
