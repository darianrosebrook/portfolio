      prop, because that component forwards style to its inner img but className to
      its container, so a class would move the sizing onto the wrong element
  - id: A2
    given: 'the dashboard before and after'
    when: 'inline style objects are counted'
    then: >-
      the total drops from 15 to 7, because eight of the fifteen are removed and the
      cover Image style is deliberately retained
