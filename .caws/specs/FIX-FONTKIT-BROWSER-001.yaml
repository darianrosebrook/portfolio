id: FIX-FONTKIT-BROWSER-001
title: 'Bundle fontkit for the typography inspector browser runtime'
mode: fix
lifecycle_state: active
created_at: '2026-10-09T15:59:55.112Z'
updated_at: '2026-10-09T15:59:55.112Z'
created_by_session: '01a12160-2ad6-7b13-87cc-f11cd6b323a6'
blast_radius:
  modules:
    - 'Next.js client bundling and FontInspector'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'next.config.mjs'
    - 'ui/modules/FontInspector/'
    - 'test/fontkit-browser.test.mjs'
  out: []
invariants:
  - 'Font parsing stays lazy and uses the installed browser-compatible fontkit package'
  - 'Actual import and font parsing failures remain observable'
acceptance:
  - id: A1
    given: 'the installed fontkit package and the Next client webpack configuration'
    when: 'a browser bundle imports fontkit and parses Inter'
    then: 'the import succeeds without a Node require global and exposes a drawable glyph with variable weight outlines'
  - id: A2
    given: 'the typography page in the webpack development server'
    when: 'the inspector loads and the user selects each font'
    then: 'Nohemi Inter Neon and Newsreader provide glyph controls and rendered glyphs without fontkit import errors or normal-loading missing-glyph warnings'
observability:
  - 'Browser console errors and inspector glyph controls distinguish import or parse failure from normal loading'
rollback:
  - 'Revert the scoped source commit to restore the previous bundling configuration'
non_functional: {}
contracts: []
