id: FIX-008
title: 'Record the unrecorded case-only rename of Links and Breadcrumbs component dirs'
risk_tier: 3
mode: fix
lifecycle_state: active
worktree: fix-008-dir-case
created_at: '2026-08-06T13:45:28.501Z'
updated_at: '2026-08-06T13:45:28.501Z'
blast_radius:
  modules:
    - ui/components
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'ui/components/Links/'
    - 'ui/components/Breadcrumbs/'
  out: []
invariants:
  - Every path git records under ui/components matches the directory case on disk
  - Generated .tokens.css banners name a source path that resolves on a case-sensitive filesystem
  - No import specifier changes; the two components have no live callers to break
acceptance:
  - id: A1
    given: git records ui/components/links and ui/components/breadcrumbs while disk and all 51 sibling dirs are PascalCase
    when: the case-only rename is recorded via the two-step git mv required on a case-insensitive filesystem
    then: git ls-files reports ui/components/Links and ui/components/Breadcrumbs, and no component dir under ui/components begins with a lowercase letter
  - id: A2
    given: the committed .tokens.css banners name lowercase source paths that no longer exist on disk
    when: npm run tokens:components regenerates them after the rename
    then: the three .tokens.css files name PascalCase sources and a second consecutive run leaves the working tree clean
  - id: A3
    given: npm run build regenerates tokens and previously dirtied the tree on every run
    when: build is run twice in a row on a clean tree after this fix
    then: git status reports no modified files, so .husky/pre-push no longer dirties the working tree
non_functional: {}
contracts: []
